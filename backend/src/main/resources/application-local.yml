server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:intelsense_local;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000/api/v1}

jwt:
  secret: ${JWT_SECRET:change-me-local-intelsense-ai-jwt-signing-key-2026}
  expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
